services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reposeer}
      POSTGRES_USER: ${POSTGRES_USER:-reposeer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reposeer-local-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reposeer} -d ${POSTGRES_DB:-reposeer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-reposeer}:${POSTGRES_PASSWORD:-reposeer-local-dev}@postgres:5432/${POSTGRES_DB:-reposeer}}
      REPOSEER_RATE_LIMIT_HMAC_KEY: ${REPOSEER_RATE_LIMIT_HMAC_KEY:-}
      REPOSEER_CORS_ORIGINS: ${REPOSEER_CORS_ORIGINS:-http://localhost:3001}
      # Retained only to process ZIP jobs queued before the upload path was retired.
      REPOSEER_MAX_ARCHIVE_SIZE_MB: ${REPOSEER_MAX_ARCHIVE_SIZE_MB:-25}
      REPOSEER_MAX_EXTRACTED_SIZE_MB: ${REPOSEER_MAX_EXTRACTED_SIZE_MB:-100}
      REPOSEER_MAX_ARCHIVE_FILES: ${REPOSEER_MAX_ARCHIVE_FILES:-2000}
      REPOSEER_REPORT_RETENTION_DAYS: ${REPOSEER_REPORT_RETENTION_DAYS:-7}
      REPOSEER_ANALYSIS_STALE_SECONDS: ${REPOSEER_ANALYSIS_STALE_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
