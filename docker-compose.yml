services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      REPOSEER_CORS_ORIGINS: ${REPOSEER_CORS_ORIGINS:-http://localhost:3001}
      REPOSEER_MAX_ARCHIVE_SIZE_MB: ${REPOSEER_MAX_ARCHIVE_SIZE_MB:-50}
      REPOSEER_MAX_EXTRACTED_SIZE_MB: ${REPOSEER_MAX_EXTRACTED_SIZE_MB:-250}
      REPOSEER_MAX_ARCHIVE_FILES: ${REPOSEER_MAX_ARCHIVE_FILES:-10000}
      REPOSEER_JOB_TTL_SECONDS: ${REPOSEER_JOB_TTL_SECONDS:-3600}
      REPOSEER_MAX_JOBS: ${REPOSEER_MAX_JOBS:-100}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_MAX_ARCHIVE_SIZE_MB: ${REPOSEER_MAX_ARCHIVE_SIZE_MB:-50}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
